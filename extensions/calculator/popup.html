<!DOCTYPE html>
<html>
<head>
  <title>Kelly Calculator</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-container">
    <header>
      <h2>Kelly Calculator</h2>
    </header>
    
    <div class="calculator-container">
      <div class="settings-panel">
        <div class="input-row">
          <div class="input-group">
            <label for="projectedOdds">Projected Odds</label>
            <input type="text" id="projectedOdds" placeholder="-110, +150, 100">
          </div>
          <div class="input-group">
            <label for="offeredOdds">Offered Odds</label>
            <input type="text" id="offeredOdds" placeholder="-110, +150, 100">
          </div>
        </div>
        <div class="input-row">
          <div class="input-group">
            <label for="newKellyBankroll">Bankroll ($)</label>
            <input type="number" id="newKellyBankroll" value="4000" min="0">
          </div>
        </div>
        <div class="input-row">
          <div class="input-group">
            <label for="newKellyMultiplier">Kelly %</label>
            <input type="number" id="newKellyMultiplier" value="1.0" min="0" max="1" step="0.01">
          </div>
        </div>
        <button id="calculateKellyButton">Calculate Kelly</button>
        <div id="kellyResults" class="kelly-results">
          <p>Optimal Bet: <span id="optimalBetPercentage">N/A</span></p>
          <p>Wager Amount: <span id="recommendedWagerAmount">N/A</span></p>
        </div>
      </div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
